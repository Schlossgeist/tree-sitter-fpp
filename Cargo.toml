[package]
name = "tree-sitter-fpp"
description = "Grammar of Fiasco's Preprocess C++ dialect for tree-sitter"
version = "0.23.4"
authors = [
  "Nick Naumann <nick.naumann@mailbox.tu-dresden.de>",
]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "cpp"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/Schlossgeist/tree-sitter-fpp"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "LICENSE",
  "bindings/rust/*",
  "./grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"
tree-sitter = { version = "0.26", optional = true }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.5"
